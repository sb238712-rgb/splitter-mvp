<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#251a42"><meta name="referrer" content="no-referrer"><title>Splitter — подтверждение друга</title>
<style>
:root{--purple:#1659E8;--deep:#104DB7;--muted:#72809C;--line:#E3EAF5;--good:#107654;--bad:#b33b54}*{box-sizing:border-box}body{font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#F3F6FC;color:#152944;margin:0}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{max-width:490px;min-height:100vh;background:white;margin:auto;box-shadow:0 14px 60px #241a4212}.header{padding:22px 23px 28px;color:white;background:#104DB7;border-radius:0 0 25px 25px}.brand{font-weight:900;font-size:23px;letter-spacing:-.9px;display:flex;gap:10px;align-items:center}.mark{width:35px;height:35px;border-radius:11px;background:#ff7862;display:grid;place-items:center;font-size:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:850;color:#b9a8f8;margin-top:28px}.header h1{font-size:29px;letter-spacing:-1px;line-height:1.17;margin:9px 0}.header p{font-size:13px;color:#d5cee3;margin:0;line-height:1.6}.body{padding:24px}.card{border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:15px}.label{font-size:12px;color:var(--muted);font-weight:750}.amount{font-size:34px;font-weight:900;letter-spacing:-1.6px;color:var(--purple);margin:4px 0}.sub{color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;margin:13px 0;font-size:13px}.row b{text-align:right}.divider{height:1px;background:var(--line);margin:17px 0}.item{padding:8px 0;border-bottom:1px solid #f4f1f8;display:flex;justify-content:space-between;gap:10px;font-size:13px}.item:last-child{border:0}.note{background:#f6f3ff;color:#6d6087;font-size:12px;padding:14px;border-radius:13px;line-height:1.65;margin:16px 0}.btn{width:100%;border:0;border-radius:14px;padding:15px 17px;font-weight:850;margin:6px 0;background:var(--purple);color:white}.btn.secondary{border:1px solid #ded7ec;background:white;color:var(--deep)}.btn.weak{border:0;background:#fff0f2;color:var(--bad);font-size:12px}.btn:disabled{background:#e1dce9;color:#8c839c}.foot{font-size:11px;line-height:1.6;color:var(--muted);margin:22px 0 9px;text-align:center}.result{background:#e8f8f1;padding:20px;border-radius:17px;text-align:center;color:var(--good)}.result.bad{background:#fff0f2;color:var(--bad)}.result-icon{font-size:37px;font-weight:900}.result h2{margin:5px 0 8px;font-size:21px}.result p{font-size:13px;margin:0;line-height:1.6}.loading{text-align:center;padding:60px 0;color:var(--muted)}.time{font-size:12px;font-weight:800;color:#a06822;background:#fff7e7;border-radius:20px;padding:6px 9px}
</style></head><body><div class="shell"><header class="header"><div class="brand"><span class="mark">↗</span>Moby <span style="font-size:13px;font-weight:600;opacity:.8">/ Splitter · демо</span></div><div class="eyebrow">Личное приглашение · Банковское уведомление</div><h1>Подтвердите<br>свою долю</h1><p>Вам поступил запрос на совместную оплату Splitter. Доступна только сумма вашего участия.</p></header><main class="body" id="app"><div class="loading">Загружаем приглашение…</div></main></div>
<script>
'use strict';
const token=decodeURIComponent(location.pathname.startsWith('/friend/')?location.pathname.split('/').pop():(new URLSearchParams(location.search)).get('token')||'');
let info=null,busy=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>new Intl.NumberFormat('ru-BY',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100)+' BYN';
function remaining(){let s=Math.max(0,Math.ceil((info.expires_at-Date.now())/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
async function api(path,method='GET',body){let res=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});let data=await res.json();if(!res.ok)throw new Error(data.error||'Не удалось связаться с сервером');return data;}
function render(){if(!info)return;let terminal=info.session_status!=='pending',stillPending=info.status==='pending'&&!terminal;
 let result='';
 if(!stillPending){
  const success=info.session_status==='success';const agreed=info.status==='approved';
  let heading=success?'Все подтвердили':info.session_status==='pending'&&agreed?'Спасибо за согласие!':info.status==='rejected'?'Вы отклонили запрос':info.status==='insufficient'?'Демо-проверка не пройдена':'Запрос завершён';
  let desc=success?'Все участники согласились, демо-заказ оплачен. Настоящих списаний не было.':info.session_status==='pending'&&agreed?'Ваш ответ сохранён на сервере. Ожидаем остальных участников.':info.reason||'Запрос на совместную оплату закрыт.';
  result=`<div class="result ${success||info.session_status==='pending'&&agreed?'':'bad'}"><div class="result-icon">${success||agreed?'✓':'×'}</div><h2>${esc(heading)}</h2><p>${esc(desc)}</p></div>`;
 }
 document.getElementById('app').innerHTML=`<div class="card"><div class="row" style="margin:0 0 10px"><div><div class="label">Участник</div><strong>${esc(info.name)}</strong></div><span class="time" id="clock">${remaining()}</span></div><div class="divider"></div><div class="label">Сумма вашего участия</div><div class="amount">${money(info.amount_cents)}</div><div class="sub">Подтверждается только ваша доля. Состав заказа не раскрывается.</div></div>
 <div class="note">Банк показывает участнику только его долю и сумму совместной оплаты. Состав корзины и чек доступны только инициатору.</div>
 ${result||`<div class="note">☝ Вы подтверждаете участие <strong>только в демонстрационном заказе</strong>. Никаких денег с вашего счёта не снимут, и ваши карты не запрашиваются. Это подтверждение по персональной ссылке, а не банковская идентификация.</div>
 <button class="btn" id="approve" onclick="respond('approve')">✓ Согласен оплатить ${money(info.amount_cents)}</button>
 <button class="btn secondary" id="reject" onclick="respond('reject')">Отклонить запрос</button>
 <button class="btn weak" id="insufficient" onclick="respond('insufficient')">Смоделировать нехватку средств</button>`}
 <p class="foot">Splitter MVP · BYN · без настоящих платежей<br>Ссылка подтверждения не заменяет банковскую идентификацию или согласие на реальное списание.</p>`;
}
async function load(){if(!token){document.getElementById('app').innerHTML='<div class="loading">Неверная ссылка приглашения.</div>';return;}
 try{let newest=await api('/api/invite/'+encodeURIComponent(token));const changed=!info||newest.status!==info.status||newest.session_status!==info.session_status;info=newest;if(changed)render();let clock=document.getElementById('clock');if(clock)clock.textContent=remaining();}catch(e){if(!info)document.getElementById('app').innerHTML='<div class="loading">'+esc(e.message)+'</div>';}}
async function respond(decision){if(busy||!info||info.status!=='pending'||info.session_status!=='pending')return;
 let prompt=decision==='approve'?`Подтвердить участие на ${money(info.amount_cents)}? Это ДЕМО, денег не спишут.`:decision==='reject'?'Отклонить весь общий заказ?':'Отменить весь заказ с причиной «недостаточно средств» (демо)?';
 if(!confirm(prompt))return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{info=await api('/api/invite/'+encodeURIComponent(token)+'/respond','POST',{decision});render();}catch(e){alert(e.message);await load();}finally{busy=false;}}
load();setInterval(load,2200);
</script></body></html>
