<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Splitter — присоединиться</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#17243b;font:15px/1.5 Inter,system-ui,Arial,sans-serif}.shell{max-width:480px;margin:auto;min-height:100vh;background:white;box-shadow:0 14px 50px #17386512}header{background:#1659e8;color:white;padding:32px 25px 42px;border-radius:0 0 25px 25px}header b{font-size:25px}h1{font-size:27px;line-height:1.2;margin:27px 0 9px}header p{font-size:14px;margin:0;color:#dfebff}.main{padding:28px 24px}label{display:block;font-weight:700;margin:20px 0 8px}.input{width:100%;border:1px solid #dce5f3;border-radius:13px;padding:16px;font:inherit}.btn{width:100%;border:0;background:#1659e8;color:white;border-radius:14px;padding:16px;margin-top:22px;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.notice{background:#ecf3ff;padding:16px;border-radius:13px;color:#41618e;margin:17px 0}.err{color:#aa3348}.ok{background:#e4f8eb;color:#087346;padding:22px;border-radius:18px;font-size:17px;font-weight:750}.foot{font-size:12px;color:#7a859a;margin-top:35px}</style></head><body><div class="shell"><header><b>↗ Moby / Splitter</b><h1>Присоединитесь к совместной оплате</h1><p>Добавление участника по QR · демонстрация</p></header><main class="main" id="main">Подключаемся…</main></div><script>
const token=decodeURIComponent(location.pathname.startsWith('/join/')?location.pathname.split('/').pop():(new URLSearchParams(location.search)).get('token')||'');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){let r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'});let v=await r.json();if(!r.ok)throw Error(v.error||'Ошибка связи');return v}
async function load(){try{if(!token)throw Error('Некорректная ссылка.');await api('/api/join/'+encodeURIComponent(token));document.getElementById('main').innerHTML=`<div class="notice">Вы добавляете себя в список участников инициатора. Это <strong>не подтверждение платежа</strong>; запрос на вашу долю придёт отдельно после распределения суммы.</div><form onsubmit="join(event)"><label for="name">Как вас зовут?</label><input id="name" class="input" maxlength="40" autocomplete="name" placeholder="Например, Катя" required><button id="submit" class="btn">Присоединиться</button></form><p class="foot">Не вводите номер карты, PIN или банковские данные. Демонстрация не осуществляет платежи.</p>`}catch(e){document.getElementById('main').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
async function join(e){e.preventDefault();let b=document.getElementById('submit');b.disabled=true;try{let r=await api('/api/join/'+encodeURIComponent(token),'POST',{name:document.getElementById('name').value.trim()});document.getElementById('main').innerHTML=`<div class="ok">✓ ${esc(r.name)}, вы добавлены в список друзей!</div><div class="notice">Инициатор увидит вас в Splitter, распределит доли и позже отправит отдельную ссылку для подтверждения. Пока ничего подтверждать или оплачивать не нужно.</div>`;}catch(e){alert(e.message);b.disabled=false}}
load();</script></body></html>
